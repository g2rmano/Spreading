# Fly.io — app Django (web + workers). Região São Paulo (gru).
# Secrets (NÃO versionar): fly secrets set DJANGO_SECRET_KEY=... DATABASE_URL=... \
#   WHATSAPP_API_KEY=... SECRETS_FERNET_KEY=... AMAZON_* EMAIL_* TELEGRAM_API_ID=...
# (login web do ML NÃO precisa de secret: roda no Chromium local — ver ml_conexao.py)
app = "spreading-web"
primary_region = "gru"
# Mesmo motivo do spreading-wa, em escala menor: o default da Fly são 5s entre o
# sinal e o SIGKILL, e esta máquina roda gunicorn com --timeout 120, mais nove
# workers de loop, um Chromium de raspagem e as sessões do ML gravando em /data.
# Cortar tudo em 5s interrompe requisição em voo e escrita de sessão pela metade.
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "honcho -f Procfile.web start"
  worker = "honcho -f Procfile.worker start"

[[restart]]
  policy = "always"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "spreading-web.fly.dev"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://spreading-web.fly.dev"
  # Piloto Awin ativo; cada afiliado conecta o próprio token pela tela Conta.
  AWIN_INTEGRATION_ENABLED = "1"
  ML_AUTH_DIR = "/data/ml_sessions"
  # O painel e os loops agora rodam em VMs distintas; PostgreSQL é o estado comum.
  AUTOMACAO_STATE_BACKEND = "database"
  AUTOMACAO_DEFAULT_ENABLED = "scrape,envio,links,relatorios"
  # Serviço do WhatsApp na rede privada do Fly (.internal).
  WHATSAPP_API_URL = "http://spreading-wa.internal:3000"

# migra o banco a cada deploy, antes de trocar as máquinas.
# (createcachetable saiu: o cache é LocMem por processo -- ver settings.py --, então
# a tabela nunca foi lida por ninguém.)
#
# `tenant_constraints --ensure` entrou aqui em 02/09/2026 porque a ausência dele
# deixou a produção derivar em silêncio: auditoria encontrou OITO CHECKs
# `organization_required` que nunca foram instalados (browsersession,
# organizationfeatureoverride, cupomdisponibilidade, cupomdisponibilidadeevento,
# cupomvalidacao, linkafiliadoprodutocupomusuario, publicacaoevento,
# publicacaotentativa). Não havia linha órfã — os signals de tenant seguraram —
# mas a trava do banco não existia. Tabela nova nasce sem CHECK a menos que algo
# no deploy garanta; agora garante.
[deploy]
  release_command = "sh -c 'env RELEASE_COMMAND=1 python django/manage.py check --deploy && env RELEASE_COMMAND=1 python django/manage.py migrate --noinput && env RELEASE_COMMAND=1 python django/manage.py tenant_constraints --ensure && env RELEASE_COMMAND=1 python django/manage.py tenant_rls --enable && env TENANT_SYSTEM_PROCESS=1 python django/manage.py bootstrap_superuser'"

# Volume legado e estado local da máquina web. As credenciais ML e as sessões de
# navegador novas ficam cifradas no PostgreSQL, pois o worker roda em outra VM.
[[mounts]]
  source = "ml_data"
  destination = "/data"
  processes = ["web"]

[http_service]
  processes = ["web"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"
    headers = { Host = "spreading-web.fly.dev", X-Forwarded-Proto = "https" }

# O check acima cobre SÓ o process group `web`. Sem o bloco abaixo, as oito
# esteiras do `worker` podiam estar todas paradas e `fly status` seguia verde,
# porque o app inteiro era julgado pelo gunicorn da outra máquina — e
# `deploy/fly-nightly-power.sh` herda o mesmo engano ao aprovar o religamento.
# O processo `saude` do Procfile.worker publica o heartbeat que as esteiras já
# gravam; aqui só o consultamos.
#
# grace_period de 240s: o Procfile escalona os arranques até 120s (`canais`) e a
# esteira mais tardia (`scrape`, sleep 90) só grava o primeiro heartbeat depois
# disso. Um período curto reprovaria todo boot legítimo.
[checks]
  [checks.esteiras]
    type = "http"
    port = 8081
    method = "get"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "240s"
    processes = ["worker"]

# ATENÇÃO — este bloco é o que a máquina REALMENTE roda. Não suba sem decidir o custo.
#
# Desde o desmembramento, esta VM roda somente gunicorn (1 processo, 8 threads) e, sob
# demanda, um Chromium de login interativo. Os nove loops e a raspagem ficam na VM
# `worker`. Medido em 01/09/2026: 424 MB usados, 1,59 GB disponíveis, loadavg e pressão
# de CPU/memória zerados. Manter duas CPUs preserva a responsividade do live view; 1 GB
# deixa mais de 500 MB de margem em repouso e reduz o preset GRU de US$18,40 para
# US$10,32/mês. O smoke/load test de produção é obrigatório após cada alteração aqui.
# Preços: tabela oficial da região gru; não incluem volume, câmbio ou tributos do cartão.
[[vm]]
  processes = ["web"]
  size = "shared-cpu-2x"
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  # Playwright/Chromium precisa de 2 GB; 1 GB torna a economia falsa por OOM/restarts.
  size = "shared-cpu-2x"
  memory = "2gb"
